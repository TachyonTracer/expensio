<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#gradient)"/>
  
  <!-- Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Main Content -->
  <g transform="translate(100, 150)">
    <!-- Logo/Icon -->
    <circle cx="80" cy="80" r="40" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
    <text x="80" y="90" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="32" font-weight="bold">E</text>
    
    <!-- Title -->
    <text x="150" y="60" fill="white" font-family="Arial, sans-serif" font-size="64" font-weight="bold">Expensio</text>
    <text x="150" y="110" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif" font-size="32">Smart Expense Management</text>
    
    <!-- Features -->
    <g transform="translate(0, 180)">
      <text x="0" y="0" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="24">✓ OCR Receipt Scanning</text>
      <text x="0" y="40" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="24">✓ Multi-Currency Support</text>
      <text x="0" y="80" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="24">✓ Automated Approval Workflows</text>
    </g>
    
    <!-- CTA -->
    <g transform="translate(600, 200)">
      <rect x="0" y="0" width="300" height="60" rx="30" fill="white" fill-opacity="0.2"/>
      <text x="150" y="40" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Start Free Trial</text>
    </g>
  </g>
</svg>